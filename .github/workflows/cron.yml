name: Scheduler

# Calls Merqado's job runner every 15 minutes. Each job runs at most once per slot
# (see src/lib/cron), so late, duplicate or manual runs are safe.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run due jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://merqado.ai' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl -fsS --retry 3 --retry-all-errors --retry-delay 20 --max-time 300 \
            -X POST -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/internal/cron"
