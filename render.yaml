# Render Blueprint. Database is Turso (libSQL), hosted outside Render.
services:
  - type: web
    name: merqado
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Set once and never change: it decrypts every saved AI and storage credential.
      - key: MERQADO_SECRET_KEY
        sync: false
      # Only needed for firms on managed AI billing.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Google sign-in, set up automatically on start (see scripts/bootstrap.ts).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SSO_ADMIN_EMAIL
        sync: false
      - key: SSO_FIRM_NAME
        sync: false
      # Set when using a custom domain; SSO redirects use it.
      - key: APP_URL
        sync: false
